<title>Section Layout Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>

<style>
  :root {
    --page-bg: #f5f4f1;
    --surface: #ffffff;
    --surface-sunken: #f7f5f1;
    --border: #e7e2d9;
    --border-soft: #ece7dd;
    --ink: #262420;
    --ink-soft: #4d4a44;
    --muted: #948d80;
    --bar-strong: #cbc4b6;
    --bar: #e7e2d6;
    --accent: #eb5a41;
    --accent-contrast: #fffaf7;
    --chip-bg: #efeae0;
    --shadow: 0 1px 2px rgba(38, 36, 32, 0.03), 0 10px 30px -14px rgba(38, 36, 32, 0.12);
    --font: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #16140f;
      --surface: #201d17;
      --surface-sunken: #262319;
      --border: #3a3527;
      --border-soft: #2d2a1e;
      --ink: #f3efe6;
      --ink-soft: #cfc8ba;
      --muted: #a39c8c;
      --bar-strong: #56503e;
      --bar: #38342a;
      --accent: #ff6f52;
      --accent-contrast: #1c1109;
      --chip-bg: #2d2a1e;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 14px 32px -16px rgba(0, 0, 0, 0.6);
    }
  }
  :root[data-theme="dark"] {
    --page-bg: #16140f;
    --surface: #201d17;
    --surface-sunken: #262319;
    --border: #3a3527;
    --border-soft: #2d2a1e;
    --ink: #f3efe6;
    --ink-soft: #cfc8ba;
    --muted: #a39c8c;
    --bar-strong: #56503e;
    --bar: #38342a;
    --accent: #ff6f52;
    --accent-contrast: #1c1109;
    --chip-bg: #2d2a1e;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 14px 32px -16px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--page-bg);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  .eyebrow {
    font-size: 0.8125rem;
    font-weight: 800;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    box-shadow: var(--shadow);
  }
  .hairline { background: var(--border); height: 1px; }

  .bar { background: var(--bar); border-radius: 999px; height: 8px; }
  .bar-strong { background: var(--bar-strong); border-radius: 999px; height: 8px; }
  .pill { background: var(--bar); border-radius: 999px; height: 16px; }

  .preset-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }
  .preset-card:hover { border-color: #d5cfc2; }
  .preset-card[aria-checked="true"] {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .preset-card:focus-visible, .thumb:focus-visible, .reset-link:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .check-badge {
    background: var(--accent);
    color: var(--accent-contrast);
  }

  .thumb {
    background: var(--surface-sunken);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .thumb:hover:not([aria-checked="true"]) { border-color: #d5cfc2; }
  .thumb[aria-checked="true"] {
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }

  .section-row { border: 1px solid var(--border); background: var(--surface); border-radius: 14px; }

  .reset-link { color: var(--accent); }
  .reset-link:hover { text-decoration-thickness: 2px; }

  .preview-panel { background: var(--surface); border: 1px solid var(--border-soft); box-shadow: var(--shadow); border-radius: 20px; }
  .preview-name-bar { background: var(--ink); opacity: 0.82; border-radius: 999px; }

  @media (prefers-reduced-motion: reduce) {
    .preset-card, .thumb { transition: none !important; }
  }

  ::selection { background: var(--accent); color: var(--accent-contrast); }
</style>

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useCallback } = React;

/* ------------------------------------------------------------------ */
/* Data model                                                          */
/* ------------------------------------------------------------------ */

const SECTIONS = [
  { id: 'work',         label: 'Work Experience', options: ['Split', 'Standard'] },
  { id: 'education',    label: 'Education',       options: ['Split', 'Standard'] },
  { id: 'publications', label: 'Publications',    options: ['Split', 'Standard'] },
  { id: 'awards',       label: 'Awards',          options: ['Split', 'Standard'] },
  { id: 'skills',       label: 'Skills',          options: ['Grid', 'Two column', 'List'] },
  { id: 'hobbies',      label: 'Hobbies',         options: ['Inline', 'List'] },
];

const PRESETS = {
  default: { work: 'Standard', education: 'Standard', publications: 'Standard',
             awards: 'Standard', skills: 'Grid', hobbies: 'Inline' },
  compact: { work: 'Split', education: 'Split', publications: 'Split',
             awards: 'Split', skills: 'List', hobbies: 'Inline' },
};

const PRESET_META = {
  default: { title: 'Default', subtitle: 'Matched for your template.' },
  compact: { title: 'Compact', subtitle: 'Fits more on one page.' },
  custom:  { title: 'Custom',  subtitle: 'Your own arrangement.' },
};

const SECTION_KEYS = SECTIONS.map(s => s.id);

function valuesEqual(a, b) {
  return SECTION_KEYS.every(k => a[k] === b[k]);
}

function computeActivePreset(values) {
  if (valuesEqual(values, PRESETS.default)) return 'default';
  if (valuesEqual(values, PRESETS.compact)) return 'compact';
  return 'custom';
}

/* ------------------------------------------------------------------ */
/* Icons                                                                */
/* ------------------------------------------------------------------ */

function IconLayout() {
  return (
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="2.5" />
      <path d="M9 4v16" />
      <path d="M3 9h6" />
    </svg>
  );
}
function IconSliders() {
  return (
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round">
      <line x1="4" y1="6" x2="14" y2="6" />
      <circle cx="17" cy="6" r="2" />
      <line x1="10" y1="12" x2="20" y2="12" />
      <circle cx="7" cy="12" r="2" />
      <line x1="4" y1="18" x2="14" y2="18" />
      <circle cx="17" cy="18" r="2" />
    </svg>
  );
}
function IconTune() {
  return (
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round">
      <line x1="4" y1="21" x2="4" y2="14" /><line x1="4" y1="10" x2="4" y2="3" />
      <line x1="12" y1="21" x2="12" y2="12" /><line x1="12" y1="8" x2="12" y2="3" />
      <line x1="20" y1="21" x2="20" y2="16" /><line x1="20" y1="12" x2="20" y2="3" />
      <line x1="1" y1="14" x2="7" y2="14" /><line x1="9" y1="8" x2="15" y2="8" />
      <line x1="17" y1="16" x2="23" y2="16" />
    </svg>
  );
}
function IconCheck() {
  return (
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="20 6 9 17 4 12" />
    </svg>
  );
}

/* ------------------------------------------------------------------ */
/* Preset row                                                           */
/* ------------------------------------------------------------------ */

function PresetChip({ presetKey, icon, active, onSelect, tabIndex, chipRef }) {
  const meta = PRESET_META[presetKey];
  return (
    <button
      ref={chipRef}
      type="button"
      role="radio"
      aria-checked={active}
      data-preset={presetKey}
      tabIndex={tabIndex}
      onClick={() => onSelect(presetKey)}
      className="preset-card relative flex-1 flex items-start gap-3.5 px-6 py-5 text-left"
    >
      <span style={{ color: 'var(--ink)' }} className="mt-0.5">{icon}</span>
      <span className="flex flex-col gap-0.5">
        <span className="flex items-center gap-2 font-extrabold text-[1.05rem] tracking-tight" style={{ color: 'var(--ink)' }}>
          {meta.title.toUpperCase()}
          {active && (
            <span className="check-badge inline-flex items-center justify-center w-4 h-4 rounded-full">
              <IconCheck />
            </span>
          )}
        </span>
        <span className="text-[0.9rem]" style={{ color: 'var(--muted)' }}>{meta.subtitle}</span>
      </span>
    </button>
  );
}

function PresetRow({ activePreset, onSelect }) {
  const order = ['default', 'compact', 'custom'];
  const refs = useRef({});

  const onKeyDown = (e) => {
    if (!['ArrowRight', 'ArrowLeft'].includes(e.key)) return;
    const active = document.activeElement;
    const idx = order.indexOf(active && active.dataset ? active.dataset.preset : undefined);
    e.preventDefault();
    const dir = e.key === 'ArrowRight' ? 1 : -1;
    const next = (idx === -1 ? 0 : idx + dir + order.length) % order.length;
    const el = refs.current[order[next]];
    if (el) el.focus();
  };

  return (
    <div role="radiogroup" aria-label="Layout type" className="flex gap-4" onKeyDown={onKeyDown}>
      {order.map((key) => {
        const icon = key === 'default' ? <IconLayout /> : key === 'compact' ? <IconTune /> : <IconSliders />;
        return (
          <PresetChip
            key={key}
            presetKey={key}
            icon={icon}
            active={activePreset === key}
            onSelect={onSelect}
            tabIndex={activePreset === key ? 0 : -1}
            chipRef={(el) => { refs.current[key] = el; }}
          />
        );
      })}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Section option thumbnails                                           */
/* ------------------------------------------------------------------ */

function Bars({ n = 3, className = "" }) {
  const widths = ['100%', '86%', '66%', '80%'];
  return (
    <div className={"flex flex-col gap-2 " + className}>
      {Array.from({ length: n }).map((_, i) => (
        <div key={i} className="bar" style={{ width: widths[i % widths.length] }} />
      ))}
    </div>
  );
}

function ThumbSplitStandard({ option }) {
  if (option === 'Split') {
    return (
      <div className="flex gap-3 p-4">
        <div className="flex flex-col gap-2" style={{ width: '30%' }}>
          <div className="bar-strong" style={{ width: '78%' }} />
          <div className="bar" style={{ width: '48%' }} />
        </div>
        <div style={{ width: '70%' }}><Bars n={3} /></div>
      </div>
    );
  }
  return (
    <div className="p-4">
      <div className="bar-strong mb-2" style={{ width: '68%' }} />
      <Bars n={3} />
    </div>
  );
}

function ThumbSkills({ option }) {
  if (option === 'Grid') {
    return (
      <div className="grid grid-cols-3 gap-2 p-4">
        {Array.from({ length: 6 }).map((_, i) => <div key={i} className="bar" />)}
      </div>
    );
  }
  if (option === 'Two column') {
    return (
      <div className="grid grid-cols-2 gap-x-4 gap-y-2 p-4">
        {Array.from({ length: 4 }).map((_, i) => <div key={i} className="bar" />)}
      </div>
    );
  }
  return <div className="p-4"><Bars n={4} /></div>;
}

function ThumbHobbies({ option }) {
  if (option === 'Inline') {
    return (
      <div className="flex flex-wrap gap-2 p-4">
        {[44, 34, 52, 30].map((w, i) => <div key={i} className="pill" style={{ width: w }} />)}
      </div>
    );
  }
  return (
    <div className="flex flex-col gap-2 p-4">
      {[0, 1, 2].map(i => <div key={i} className="bar" style={{ width: '58%' }} />)}
    </div>
  );
}

function OptionThumb({ sectionId, option }) {
  if (sectionId === 'skills') return <ThumbSkills option={option} />;
  if (sectionId === 'hobbies') return <ThumbHobbies option={option} />;
  return <ThumbSplitStandard option={option} />;
}

function SectionOptionGroup({ section, value, onChange }) {
  const refs = useRef({});
  const onKeyDown = (e) => {
    if (!['ArrowRight', 'ArrowLeft'].includes(e.key)) return;
    e.preventDefault();
    const idx = section.options.indexOf(value);
    const dir = e.key === 'ArrowRight' ? 1 : -1;
    const next = section.options[(idx + dir + section.options.length) % section.options.length];
    onChange(next);
    const el = refs.current[next];
    if (el) el.focus();
  };

  return (
    <div
      role="radiogroup"
      aria-label={section.label + " layout"}
      className={"grid gap-4 " + (section.options.length === 3 ? "grid-cols-3" : "grid-cols-2")}
      onKeyDown={onKeyDown}
    >
      {section.options.map(option => {
        const selected = value === option;
        return (
          <button
            key={option}
            ref={el => (refs.current[option] = el)}
            type="button"
            role="radio"
            aria-checked={selected}
            tabIndex={selected ? 0 : -1}
            onClick={() => onChange(option)}
            className="thumb relative text-left"
          >
            {selected && (
              <span className="check-badge absolute top-2.5 right-2.5 inline-flex items-center justify-center w-4 h-4 rounded-full">
                <IconCheck />
              </span>
            )}
            <OptionThumb sectionId={section.id} option={option} />
            <div className="text-center text-sm pb-3 -mt-1" style={{ color: 'var(--muted)' }}>
              {option}
            </div>
          </button>
        );
      })}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Section row — always expanded; only ever rendered in Custom          */
/* ------------------------------------------------------------------ */

function SectionRow({ section, value, onChange, showReset, onReset }) {
  return (
    <div className="section-row overflow-hidden">
      <div className="flex items-center justify-between px-5 pt-4 pb-1">
        <span className="text-[1.0625rem] font-medium" style={{ color: 'var(--ink-soft)' }}>{section.label}</span>
        {showReset && (
          <button
            type="button"
            onClick={() => onReset(section.id)}
            className="reset-link text-[0.8125rem] font-medium underline underline-offset-2 rounded"
          >
            Reset
          </button>
        )}
      </div>
      <div className="px-5 pb-5 pt-2">
        <SectionOptionGroup section={section} value={value} onChange={(opt) => onChange(section.id, opt)} />
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Preview pane                                                         */
/* ------------------------------------------------------------------ */

function PreviewBlock({ section, value }) {
  return (
    <div className="mb-5">
      <div className="text-[0.6875rem] font-bold tracking-widest uppercase mb-2" style={{ color: 'var(--muted)' }}>
        {section.label}
      </div>
      {/* Every option for this section is stacked in the same grid cell (only
          the active one visible) so the block reserves the tallest option's
          height up front — switching options re-flows the thumbnail's own
          content but never shifts anything else in the preview. */}
      <div style={{ background: 'var(--surface-sunken)', border: '1px solid var(--border-soft)', borderRadius: 12, display: 'grid' }}>
        {section.options.map(option => (
          <div key={option} style={{ gridArea: '1 / 1', visibility: option === value ? 'visible' : 'hidden' }}>
            <OptionThumb sectionId={section.id} option={option} />
          </div>
        ))}
      </div>
    </div>
  );
}

function Preview({ values }) {
  return (
    <div className="sticky top-6">
      <div className="preview-panel p-7">
        <div className="mb-6">
          <div className="preview-name-bar mb-2.5" style={{ height: 12, width: '55%' }} />
          <div className="bar" style={{ width: '35%' }} />
        </div>
        {SECTIONS.map(s => <PreviewBlock key={s.id} section={s} value={values[s.id]} />)}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* App                                                                  */
/* ------------------------------------------------------------------ */

function App() {
  const [values, setValues] = useState({ ...PRESETS.default });
  const [lastCustomValues, setLastCustomValues] = useState(null);
  const [sectionsOpen, setSectionsOpen] = useState(false); // Sections list only renders once Custom has been opened

  // The highlight is Custom the instant its chip is clicked (sectionsOpen is
  // only ever true right after that click), and otherwise stays purely
  // derived from the live values — so Default/Compact can never be "checked"
  // while the values don't actually match them.
  const activePreset = useMemo(
    () => (sectionsOpen ? 'custom' : computeActivePreset(values)),
    [values, sectionsOpen]
  );

  const handlePresetSelect = useCallback((presetKey) => {
    if (presetKey === 'custom') {
      // Always clickable: seeds the editor from the last custom snapshot if
      // one exists, or from Default otherwise — Custom starts out as
      // Default until the user actually changes something.
      setValues({ ...(lastCustomValues || PRESETS.default) });
      setSectionsOpen(true);
      return;
    }
    // Snapshot the outgoing configuration if it was genuinely custom
    // (diverged from every preset), so Custom can restore it later.
    if (computeActivePreset(values) === 'custom') {
      setLastCustomValues({ ...values });
    }
    setValues({ ...PRESETS[presetKey] });
    setSectionsOpen(false);
  }, [values, lastCustomValues]);

  const handleSectionChange = useCallback((sectionId, option) => {
    setValues(prev => {
      const next = { ...prev, [sectionId]: option };
      if (computeActivePreset(next) === 'custom') {
        setLastCustomValues({ ...next });
      }
      return next;
    });
  }, []);

  // Reset always targets Default — it's a "back to the template's own
  // arrangement" action, not tied to whichever preset was last clicked.
  const handleReset = useCallback((sectionId) => {
    setValues(prev => {
      const next = { ...prev, [sectionId]: PRESETS.default[sectionId] };
      if (computeActivePreset(next) === 'custom') {
        setLastCustomValues({ ...next });
      }
      return next;
    });
  }, []);

  return (
    <div style={{ minHeight: '100vh' }}>
      <div className="max-w-7xl mx-auto px-6 py-10 flex gap-8 items-start">
        <div className="w-[60%]">
          <div className="card p-8" style={{ borderRadius: 24 }}>
            <div className="eyebrow mb-4">Layout type</div>
            <PresetRow
              activePreset={activePreset}
              onSelect={handlePresetSelect}
            />

            <div className="hairline my-7" />

            <div className="eyebrow mb-4">Sections</div>
            {sectionsOpen ? (
              <div className="flex flex-col gap-3">
                {SECTIONS.map(section => {
                  const currentValue = values[section.id];
                  const showReset = currentValue !== PRESETS.default[section.id];
                  return (
                    <SectionRow
                      key={section.id}
                      section={section}
                      value={currentValue}
                      onChange={handleSectionChange}
                      showReset={showReset}
                      onReset={handleReset}
                    />
                  );
                })}
              </div>
            ) : (
              <p className="text-sm" style={{ color: 'var(--muted)' }}>
                Switch to <span style={{ color: 'var(--ink-soft)', fontWeight: 600 }}>Custom</span> to fine-tune individual sections.
              </p>
            )}
          </div>
        </div>

        <div className="w-[40%] shrink-0">
          <Preview values={values} />
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
