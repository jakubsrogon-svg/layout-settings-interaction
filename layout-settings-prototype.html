<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Section Layout Control — Prototype</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>
<style>
  body { background:#f5f5f4; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useCallback } = React;

/* ------------------------------------------------------------------ */
/* Data model                                                          */
/* ------------------------------------------------------------------ */

const SECTIONS = [
  { id: 'work',         label: 'Work Experience', options: ['Split', 'Standard'] },
  { id: 'education',    label: 'Education',       options: ['Split', 'Standard'] },
  { id: 'publications', label: 'Publications',    options: ['Split', 'Standard'] },
  { id: 'awards',       label: 'Awards',          options: ['Split', 'Standard'] },
  { id: 'skills',       label: 'Skills',          options: ['Grid', 'Two column', 'List'] },
  { id: 'hobbies',      label: 'Hobbies',         options: ['Inline', 'List'] },
];

const PRESETS = {
  default: { work: 'Standard', education: 'Standard', publications: 'Standard',
             awards: 'Standard', skills: 'Grid', hobbies: 'Inline' },
  compact: { work: 'Split', education: 'Split', publications: 'Split',
             awards: 'Split', skills: 'List', hobbies: 'Inline' },
};

const PRESET_META = {
  default: { title: 'DEFAULT', subtitle: 'Matched for your template.' },
  compact: { title: 'COMPACT', subtitle: 'Fits more on one page.' },
  custom:  { title: 'CUSTOM',  subtitle: 'Your own arrangement.' },
};

const SECTION_KEYS = SECTIONS.map(s => s.id);

function valuesEqual(a, b) {
  return SECTION_KEYS.every(k => a[k] === b[k]);
}

function computeActivePreset(values) {
  if (valuesEqual(values, PRESETS.default)) return 'default';
  if (valuesEqual(values, PRESETS.compact)) return 'compact';
  return 'custom';
}

/* ------------------------------------------------------------------ */
/* Icons                                                                */
/* ------------------------------------------------------------------ */

function IconLayout() {
  return (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
      <rect x="3" y="4" width="18" height="16" rx="2" />
      <path d="M9 4v16" />
      <path d="M3 9h6" />
    </svg>
  );
}
function IconSliders() {
  return (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round">
      <line x1="4" y1="6" x2="14" y2="6" />
      <circle cx="17" cy="6" r="2" />
      <line x1="10" y1="12" x2="20" y2="12" />
      <circle cx="7" cy="12" r="2" />
      <line x1="4" y1="18" x2="14" y2="18" />
      <circle cx="17" cy="18" r="2" />
    </svg>
  );
}
function IconTune() {
  return (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round">
      <line x1="4" y1="21" x2="4" y2="14" /><line x1="4" y1="10" x2="4" y2="3" />
      <line x1="12" y1="21" x2="12" y2="12" /><line x1="12" y1="8" x2="12" y2="3" />
      <line x1="20" y1="21" x2="20" y2="16" /><line x1="20" y1="12" x2="20" y2="3" />
      <line x1="1" y1="14" x2="7" y2="14" /><line x1="9" y1="8" x2="15" y2="8" />
      <line x1="17" y1="16" x2="23" y2="16" />
    </svg>
  );
}
function IconCheck() {
  return (
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="20 6 9 17 4 12" />
    </svg>
  );
}

/* ------------------------------------------------------------------ */
/* Preset row                                                           */
/* ------------------------------------------------------------------ */

function PresetChip({ presetKey, icon, active, onSelect, tabIndex, chipRef }) {
  const meta = PRESET_META[presetKey];
  return (
    <button
      ref={chipRef}
      type="button"
      role="radio"
      aria-checked={active}
      tabIndex={tabIndex}
      onClick={() => onSelect(presetKey)}
      className={
        "relative flex-1 flex items-start gap-3 rounded-xl border px-4 py-3 text-left transition-colors cursor-pointer " +
        (active ? "border-red-400 bg-white" : "border-stone-200 bg-white hover:border-stone-300")
      }
    >
      <span className="mt-0.5 text-stone-700">{icon}</span>
      <span className="flex flex-col">
        <span className="flex items-center gap-2 font-bold tracking-wide text-sm text-stone-800">
          {meta.title}
          {active && (
            <span className="inline-flex items-center justify-center w-4 h-4 rounded-full bg-red-500 text-white">
              <IconCheck />
            </span>
          )}
        </span>
        <span className="text-sm text-stone-400">{meta.subtitle}</span>
      </span>
    </button>
  );
}

function PresetRow({ activePreset, onSelect }) {
  const order = ['default', 'compact', 'custom'];
  const refs = useRef({});

  const onKeyDown = (e) => {
    const idx = order.indexOf(document.activeElement && document.activeElement.dataset.preset);
    if (!['ArrowRight', 'ArrowLeft'].includes(e.key)) return;
    e.preventDefault();
    const dir = e.key === 'ArrowRight' ? 1 : -1;
    let next = (idx === -1 ? 0 : idx + dir + order.length) % order.length;
    const el = refs.current[order[next]];
    if (el) el.focus();
  };

  return (
    <div role="radiogroup" aria-label="Layout type" className="flex gap-3" onKeyDown={onKeyDown}>
      {order.map((key, i) => {
        const icon = key === 'default' ? <IconLayout /> : key === 'compact' ? <IconTune /> : <IconSliders />;
        return (
          <div key={key} data-preset={key} style={{ flex: 1 }}>
            <PresetChip
              presetKey={key}
              icon={icon}
              active={activePreset === key}
              onSelect={onSelect}
              tabIndex={activePreset === key ? 0 : -1}
              chipRef={(el) => {
                refs.current[key] = el;
                if (el) el.dataset.preset = key;
              }}
            />
          </div>
        );
      })}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Section option thumbnails                                           */
/* ------------------------------------------------------------------ */

function Bars({ n = 3, className = "" }) {
  const widths = ['w-full', 'w-5/6', 'w-2/3', 'w-4/5'];
  return (
    <div className={"flex flex-col gap-1.5 " + className}>
      {Array.from({ length: n }).map((_, i) => (
        <div key={i} className={"h-2 rounded bg-stone-200 " + widths[i % widths.length]} />
      ))}
    </div>
  );
}

function ThumbSplitStandard({ option }) {
  if (option === 'Split') {
    return (
      <div className="flex gap-2 p-3">
        <div className="w-1/3 flex flex-col gap-1.5">
          <div className="h-2 w-4/5 rounded bg-stone-300" />
          <div className="h-2 w-1/2 rounded bg-stone-200" />
        </div>
        <div className="w-2/3">
          <Bars n={3} />
        </div>
      </div>
    );
  }
  return (
    <div className="p-3">
      <div className="h-2 w-3/4 rounded bg-stone-300 mb-1.5" />
      <Bars n={3} />
    </div>
  );
}

function ThumbSkills({ option }) {
  if (option === 'Grid') {
    return (
      <div className="grid grid-cols-3 gap-1.5 p-3">
        {Array.from({ length: 6 }).map((_, i) => <div key={i} className="h-2 rounded bg-stone-200" />)}
      </div>
    );
  }
  if (option === 'Two column') {
    return (
      <div className="grid grid-cols-2 gap-x-3 gap-y-1.5 p-3">
        {Array.from({ length: 4 }).map((_, i) => <div key={i} className="h-2 rounded bg-stone-200" />)}
      </div>
    );
  }
  return <div className="p-3"><Bars n={4} /></div>;
}

function ThumbHobbies({ option }) {
  if (option === 'Inline') {
    return (
      <div className="flex flex-wrap gap-1.5 p-3">
        {[10, 8, 12, 7].map((w, i) => <div key={i} className={`h-4 rounded-full bg-stone-200`} style={{ width: w * 4 }} />)}
      </div>
    );
  }
  return (
    <div className="flex flex-col gap-1.5 p-3">
      {[0, 1, 2].map(i => <div key={i} className="h-2 w-3/5 rounded bg-stone-200" />)}
    </div>
  );
}

function OptionThumb({ sectionId, option }) {
  if (sectionId === 'skills') return <ThumbSkills option={option} />;
  if (sectionId === 'hobbies') return <ThumbHobbies option={option} />;
  return <ThumbSplitStandard option={option} />;
}

function SectionOptionGroup({ section, value, onChange }) {
  const refs = useRef({});
  const onKeyDown = (e) => {
    if (!['ArrowRight', 'ArrowLeft'].includes(e.key)) return;
    e.preventDefault();
    const idx = section.options.indexOf(value);
    const dir = e.key === 'ArrowRight' ? 1 : -1;
    const next = section.options[(idx + dir + section.options.length) % section.options.length];
    onChange(next);
    const el = refs.current[next];
    if (el) el.focus();
  };

  return (
    <div
      role="radiogroup"
      aria-label={section.label + " layout"}
      className={"grid gap-3 " + (section.options.length === 3 ? "grid-cols-3" : "grid-cols-2")}
      onKeyDown={onKeyDown}
    >
      {section.options.map(option => {
        const selected = value === option;
        return (
          <button
            key={option}
            ref={el => (refs.current[option] = el)}
            type="button"
            role="radio"
            aria-checked={selected}
            tabIndex={selected ? 0 : -1}
            onClick={() => onChange(option)}
            className={
              "relative rounded-xl border text-left bg-stone-50 hover:bg-stone-100 transition-colors " +
              (selected ? "border-red-400 bg-white hover:bg-white" : "border-stone-200")
            }
          >
            {selected && (
              <span className="absolute top-2 right-2 inline-flex items-center justify-center w-4 h-4 rounded-full bg-red-500 text-white">
                <IconCheck />
              </span>
            )}
            <OptionThumb sectionId={section.id} option={option} />
            <div className="text-center text-sm text-stone-500 pb-2 -mt-1">{option}</div>
          </button>
        );
      })}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Section row — always expanded; only ever rendered in Custom          */
/* ------------------------------------------------------------------ */

function SectionRow({ section, value, onChange, resetTarget, onReset }) {
  return (
    <div className="rounded-xl border border-stone-200 bg-white overflow-hidden">
      <div className="flex items-center justify-between px-4 pt-3.5 pb-1">
        <span className="font-medium text-stone-700">{section.label}</span>
        {resetTarget && (
          <button
            type="button"
            onClick={() => onReset(section.id)}
            className="text-xs text-red-500 hover:text-red-600 underline underline-offset-2"
          >
            Reset to {resetTarget}
          </button>
        )}
      </div>
      <div className="px-4 pb-4 pt-2">
        <SectionOptionGroup section={section} value={value} onChange={(opt) => onChange(section.id, opt)} />
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Preview pane                                                         */
/* ------------------------------------------------------------------ */

function PreviewBlock({ section, value }) {
  return (
    <div className="mb-4">
      <div className="text-[10px] font-bold tracking-widest text-stone-400 mb-1.5">
        {section.label.toUpperCase()}
      </div>
      <div className="rounded-lg border border-stone-100 bg-stone-50">
        <OptionThumb sectionId={section.id} option={value} />
      </div>
    </div>
  );
}

function Preview({ values }) {
  return (
    <div className="sticky top-6">
      <div className="rounded-2xl border border-stone-200 bg-white shadow-sm p-6">
        <div className="mb-5">
          <div className="h-3 w-1/2 rounded bg-stone-800 mb-2" />
          <div className="h-2 w-1/3 rounded bg-stone-300" />
        </div>
        {SECTIONS.map(s => <PreviewBlock key={s.id} section={s} value={values[s.id]} />)}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* App                                                                  */
/* ------------------------------------------------------------------ */

function App() {
  const [values, setValues] = useState({ ...PRESETS.default });
  const [lastPreset, setLastPreset] = useState('default'); // 'default' | 'compact' — reset target, and what the two preset buttons apply
  const [lastCustomValues, setLastCustomValues] = useState(null);
  const [sectionsOpen, setSectionsOpen] = useState(false); // Sections list only renders once Custom has been opened

  const activePreset = useMemo(() => computeActivePreset(values), [values]);

  const handlePresetSelect = useCallback((presetKey) => {
    if (presetKey === 'custom') {
      // Custom is now always clickable: it opens the editor, seeded from the
      // last custom configuration if one exists, or from whatever is
      // currently active otherwise. Note this can leave Default/Compact still
      // highlighted for a moment — accurate, since nothing has diverged yet.
      if (lastCustomValues) setValues({ ...lastCustomValues });
      setSectionsOpen(true);
      return;
    }
    if (activePreset === 'custom') {
      setLastCustomValues({ ...values });
    }
    setValues({ ...PRESETS[presetKey] });
    setLastPreset(presetKey);
    setSectionsOpen(false);
  }, [activePreset, values, lastCustomValues]);

  const handleSectionChange = useCallback((sectionId, option) => {
    setValues(prev => {
      const next = { ...prev, [sectionId]: option };
      if (computeActivePreset(next) === 'custom') {
        setLastCustomValues({ ...next });
      }
      return next;
    });
  }, []);

  const handleReset = useCallback((sectionId) => {
    setValues(prev => {
      const next = { ...prev, [sectionId]: PRESETS[lastPreset][sectionId] };
      if (computeActivePreset(next) === 'custom') {
        setLastCustomValues({ ...next });
      }
      return next;
    });
  }, [lastPreset]);

  return (
    <div className="min-h-screen">
      <div className="max-w-7xl mx-auto px-6 py-10 flex gap-8 items-start">
        <div className="w-[40%] shrink-0">
          <Preview values={values} />
        </div>

        <div className="w-[60%]">
          <div className="rounded-2xl bg-white shadow-sm p-6">
            <div className="text-xs font-bold tracking-widest text-stone-500 mb-3">LAYOUT TYPE</div>
            <PresetRow
              activePreset={activePreset}
              onSelect={handlePresetSelect}
            />

            <div className="h-px bg-stone-200 my-6" />

            <div className="text-xs font-bold tracking-widest text-stone-500 mb-3">SECTIONS</div>
            {sectionsOpen ? (
              <div className="flex flex-col gap-3">
                {SECTIONS.map(section => {
                  const currentValue = values[section.id];
                  const presetTarget = PRESETS[lastPreset][section.id];
                  const resetTarget = currentValue !== presetTarget
                    ? (lastPreset === 'default' ? 'Default' : 'Compact')
                    : null;
                  return (
                    <SectionRow
                      key={section.id}
                      section={section}
                      value={currentValue}
                      onChange={handleSectionChange}
                      resetTarget={resetTarget}
                      onReset={handleReset}
                    />
                  );
                })}
              </div>
            ) : (
              <p className="text-sm text-stone-400">
                Switch to <span className="font-medium text-stone-500">Custom</span> to fine-tune individual sections.
              </p>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
